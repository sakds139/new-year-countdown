<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Year Countdown</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #ff8a00, #e52e71);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .countdown {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .box {
            min-width: 90px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.35);
        }

        .number {
            display: block;
            font-size: 2rem;
            font-weight: bold;
        }

        .label {
            font-size: 0.9rem;
            color: #cbd5e1;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Countdown to New Year</h1>
        <div class="countdown">
            <div class="box"><span class="number" id="days">00</span><span class="label">Days</span></div>
            <div class="box"><span class="number" id="hours">00</span><span class="label">Hours</span></div>
            <div class="box"><span class="number" id="minutes">00</span><span class="label">Mins</span></div>
            <div class="box"><span class="number" id="seconds">00</span><span class="label">Secs</span></div>
        </div>
    </div>

    <script>
        const newYearTime = new Date(`January 1, ${new Date().getFullYear() + 1} 00:00:00`).getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const gap = newYearTime - now;

            const second = 1000;
            const minute = second * 60;
            const hour = minute * 60;
            const day = hour * 24;

            const d = Math.floor(gap / day);
            const h = Math.floor((gap % day) / hour);
            const m = Math.floor((gap % hour) / minute);
            const s = Math.floor((gap % minute) / second);

            document.getElementById('days').textContent = d.toString().padStart(2, '0');
            document.getElementById('hours').textContent = h.toString().padStart(2, '0');
            document.getElementById('minutes').textContent = m.toString().padStart(2, '0');
            document.getElementById('seconds').textContent = s.toString().padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
